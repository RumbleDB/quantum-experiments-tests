name: Validate datasets

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  validate-datasets:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout dataset repository
        uses: actions/checkout@v4
        with:
          path: datasets

      - name: Checkout Quantum Experiment Structures
        uses: actions/checkout@v4
        with:
          repository: MarkusBolinder/quantum-experiment-structures
          path: quantum-experiment-structures

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Quantum Experiment Structures
        working-directory: ${{ github.workspace }}/quantum-experiment-structures
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ensemble dataset tests
        env:
          QES_DATA_ROOT: ${{ github.workspace }}/datasets
          QES_E2E_ARTIFACT_ROOT: ${{ github.workspace }}/datasets/results
        working-directory: ${{ github.workspace }}/quantum-experiment-structures
        run: |
          pytest e2e_tests/test_ccs_datasets.py -v

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/datasets/results

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-datasets
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
          pytest e2e_tests/test_ccs_datasets.py -v
